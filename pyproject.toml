[project]
name = "python-mastery-backend"
version = "0.1.0"
description = "Local API and PostgreSQL foundation for the Python Mastery platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1,<2",
    "fastapi>=0.143.0",
    "psycopg[binary]>=3,<4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mastery-backend = "mastery_backend.cli:main"
mastery-content = "mastery_backend.content_cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.uv.build-backend]
module-name = "mastery_backend"
source-include = ["alembic.ini", "migrations/**", "docs/**", "tests/**", "AGENTS.md", ".python-version", "uv.lock", ".env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["src"]
